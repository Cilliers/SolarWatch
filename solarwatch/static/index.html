<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolarWatch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c98500'/%3E%3Cpath d='M16 2v5M16 25v5M2 16h5M25 16h5M6 6l3.5 3.5M22.5 22.5L26 26M6 26l3.5-3.5M22.5 9.5L26 6' stroke='%23c98500' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="6.5"/><path d="M16 2.5v4.5M16 25v4.5M2.5 16H7M25 16h4.5M6.5 6.5l3.2 3.2M22.3 22.3l3.2 3.2M6.5 25.5l3.2-3.2M22.3 9.7l3.2-3.2"/></svg>
      SolarWatch
    </div>
    <div class="sync" id="sync" aria-live="polite">Loading…</div>
  </header>

  <section class="fleet" aria-label="Fleet summary">
    <p class="headline" id="headline">&nbsp;</p>
    <dl class="facts" id="facts"></dl>
  </section>

  <main class="layout">
    <section class="triage" aria-label="Sites">
      <div class="filters" role="toolbar" aria-label="Filter sites">
        <div class="seg" id="platformFilter" role="group" aria-label="Platform"></div>
        <label class="check"><input type="checkbox" id="attentionOnly"> Hide normal sites</label>
        <input type="search" id="search" placeholder="Find a site" aria-label="Find a site">
      </div>
      <div class="list-head" aria-hidden="true">
        <span>Site</span><span>Battery</span><span class="num">Solar</span><span class="num">Home</span><span class="num">Grid</span><span class="num">Updated</span>
      </div>
      <ol class="sites" id="sites"></ol>
      <p class="empty" id="empty" hidden></p>

      <details class="accounts" id="accountsBox">
        <summary>Platform accounts <span id="accountsSummary"></span></summary>
        <ul id="accounts"></ul>
      </details>
    </section>

    <aside class="detail" id="detail" aria-label="Site detail" tabindex="-1">
      <p class="placeholder">Select a site to see its power flow and history.</p>
    </aside>
  </main>

  <template id="detailTpl">
    <div class="detail-head">
      <button class="close" type="button" aria-label="Close detail">✕</button>
      <h2 class="d-name"></h2>
      <p class="d-meta"></p>
    </div>
    <ul class="d-alerts"></ul>
    <svg class="flow" viewBox="0 0 320 200" role="img" aria-label="Live power flow"></svg>
    <dl class="today"></dl>
    <div class="chart-block">
      <div class="chart-head">
        <h3>Power</h3>
        <div class="seg range" role="group" aria-label="Time range">
          <button type="button" data-h="24" aria-pressed="true">24 h</button>
          <button type="button" data-h="168" aria-pressed="false">7 days</button>
        </div>
      </div>
      <div class="legend"></div>
      <div class="chart power"></div>
      <h3>Battery charge</h3>
      <div class="chart soc"></div>
    </div>
    <details class="raw"><summary>Platform data (last poll)</summary><pre></pre></details>
  </template>

  <div class="tip" id="tip" role="status" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
